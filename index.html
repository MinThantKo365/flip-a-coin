<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Coin Flip</h1>

        <p class="subtitle">
            Test your luck
        </p>

        <div class="coin-scene">
            <div class="coin" id="coin">
                <div class="side heads">
                    <div class="coin-face">
                        <span class="coin-ring coin-ring--outer"></span>
                        <span class="coin-ring coin-ring--inner"></span>
                        <span class="coin-symbol">H</span>
                        <span class="coin-label">HEAD</span>
                    </div>
                </div>

                <div class="side tails">
                    <div class="coin-face">
                        <span class="coin-ring coin-ring--outer"></span>
                        <span class="coin-ring coin-ring--inner"></span>
                        <span class="coin-symbol">T</span>
                        <span class="coin-label">TAIL</span>
                    </div>
                </div>

                <div class="coin-edge" aria-hidden="true"></div>
            </div>
        </div>

        <div class="button-group">
            <button id="flip-btn">
                Flip Coin
            </button>

            <button id="reset-btn">
                Reset
            </button>
        </div>

        <div class="stats">

            <p>
                Heads
                <span id="heads-count">0</span>
            </p>

            <p>
                Tails
                <span id="tails-count">0</span>
            </p>

        </div>

    </div>
<script src="app.js"></script>
</body>
</html>
